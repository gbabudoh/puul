name: puul
description: "PUUL - Contextual Photo Sharing App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # HTTP & API
  dio: ^5.4.0
  
  # JSON Serialization
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Camera & Media
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  
  # Permissions
  permission_handler: ^11.2.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  
  # Authentication
  flutter_secure_storage: ^9.0.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
  #   - assets/icons/
